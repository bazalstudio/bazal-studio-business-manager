<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15171c">
<title>Bazal Studio Billing</title>
<style>

:root{--red:#ed3237;--dark:#17191f;--bg:#f5f6f8;--line:#e3e6eb;--muted:#747b88}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1d2129}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#343842,#101216 60%);padding:20px}
.login-card{width:min(420px,100%);background:white;border-radius:18px;padding:26px;box-shadow:0 30px 90px #0007}
.login-logo{width:min(330px,100%);height:auto;display:block;margin:0 auto 14px;object-fit:contain;object-position:center;background:transparent;border-radius:12px}
.login-card h1{margin:12px 0 2px}.login-card p{margin:0 0 15px;color:var(--muted)}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #dfe2e8;border-radius:8px;background:white}
button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:700}.primary{background:var(--red);color:white}.secondary{background:#eef0f3;color:#272b33}.danger{color:#bb252b}.right{margin-left:auto}
.login-card button{width:100%;margin-top:10px}.note{font-size:12px;color:#78560f;background:#fff6df;border:1px solid #f0d89c;border-radius:8px;padding:9px;margin:10px 0}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{height:100vh;position:sticky;top:0;background:linear-gradient(#17191f,#101216);color:white;display:flex;flex-direction:column}
.brand{padding:14px 12px 12px;border-bottom:1px solid #2d313a}.brand img{width:100%;height:auto;max-height:86px;display:block;object-fit:contain;object-position:center;background:transparent;border-radius:10px}
nav{padding:14px 10px;display:flex;flex-direction:column;gap:4px}nav button{background:transparent;color:#d0d4dd;text-align:left;padding:12px 14px}nav button.active,nav button:hover{background:var(--red);color:white}
.logout{margin:auto 12px 12px;background:#252932;color:#eee}main{min-width:0}header{height:86px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:14px 22px;position:sticky;top:0;z-index:10}
header h2{margin:0;font-size:21px}header small{color:var(--muted)}.menu{display:none;background:#eee}#content{padding:22px}
.hero{background:linear-gradient(120deg,#17191f,#292d35);color:white;border-radius:15px;padding:20px;display:flex;align-items:center;box-shadow:0 10px 30px #1c202825}.hero p{margin:5px 0 0;color:#d3d6dc}.hero button{margin-left:auto}
.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 8px 25px #1b20300d}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase}.kpi .val{font-size:28px;font-weight:800;margin-top:8px}.red{color:var(--red)}.green{color:#168653}.amber{color:#b0730d}.blue{color:#246fca}
.section-head{display:flex;align-items:center;margin-bottom:12px}.section-head h3{margin:0;font-size:16px}.section-head .actions{margin-left:auto;display:flex;gap:8px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:760px;background:white}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{font-size:10px;text-transform:uppercase;color:#606775;background:#fafbfc}tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.b-green{background:#e8f7ef;color:#147947}.b-red{background:#feecee;color:#bb252b}.b-blue{background:#eaf3ff;color:#2368b5}.b-amber{background:#fff4df;color:#9c680f}.b-gray{background:#eef0f4;color:#59616b}
.icon{background:#eef0f3;padding:6px 8px}.empty{text-align:center;color:var(--muted);padding:28px}.summary{width:min(370px,100%);margin-left:auto;margin-top:12px}.sumrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #ddd}.total{font-size:18px;font-weight:800;border-top:2px solid #222}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 13px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#111a;display:grid;place-items:center;padding:12px;z-index:100}.modal-card{width:min(980px,100%);max-height:94vh;overflow:auto;background:white;border-radius:15px}.modal-head{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:14px 16px;z-index:2}.modal-head h3{margin:0}.modal-head button{margin-left:auto;background:#eee}.modal-body{padding:16px}
.lines{overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:12px}.lines table{min-width:850px}.toast,#toast{position:fixed;right:18px;bottom:18px;background:#1b1e24;color:white;padding:10px 14px;border-radius:9px;z-index:500;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.app{grid-template-columns:205px 1fr}}
@media(max-width:720px){.app{display:block}aside{position:fixed;left:-250px;width:240px;z-index:30;transition:.2s}aside.open{left:0}.menu{display:block;margin-right:8px}header{height:76px;padding:10px 12px}#content{padding:12px}.g4,.g2,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero{display:block}.hero button{margin:12px 0 0}.right{padding:9px}}

.user-chip{margin:10px 12px 0;padding:9px 10px;border-radius:10px;background:#242832;color:#dfe3ea;font-size:11px;line-height:1.35}.user-chip b{display:block;color:#fff;font-size:12px}.perm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:8px}.perm-grid label{display:flex;align-items:center;gap:7px;background:#f7f8fa;border:1px solid #e7e9ee;padding:8px;border-radius:8px;font-size:12px}.perm-grid input{width:auto}.muted{color:#747b88;font-size:12px}.activity{font-size:12px;padding:8px 0;border-bottom:1px solid #eef0f3}.activity:last-child{border-bottom:0}@media(max-width:650px){.perm-grid{grid-template-columns:1fr}}

.login-subtitle{text-align:center;margin:0 0 15px;color:var(--muted);font-weight:700;letter-spacing:.2px}

</style>
</head>
